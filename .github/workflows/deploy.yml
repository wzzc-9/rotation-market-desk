name: Build and deploy website

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install

      - name: Build project site
        run: pnpm run build
        env:
          VITE_BASE_URL: /rotation-market-desk/
          VITE_API_BASE_URL: https://rotation-market-desk.onrender.com

      - name: Deploy project site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Build user site
        run: pnpm run build
        env:
          VITE_BASE_URL: /
          VITE_API_BASE_URL: https://rotation-market-desk.onrender.com

      - name: Deploy user site
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: wzzc-9/wzzc-9.github.io
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true
