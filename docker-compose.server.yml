services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.server
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # This deployment is exposed through the existing public Nginx at
        # /rotation-market-desk/. Keep static assets and API calls under it.
        VITE_BASE_URL: ${VITE_BASE_URL:-/rotation-market-desk/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/rotation-market-desk}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"
